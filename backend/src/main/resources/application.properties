
spring.application.name=ai-interview-platform

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_interview_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}

# SMTP Authentication
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY}

# Contact Us Admin Email
app.contact.admin-email=${CONTACT_ADMIN_EMAIL:}

# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.com.varma.aiinterviewplatform=INFO

# Test Center Gemini Model
gemini.test-center.model=${GEMINI_TEST_CENTER_MODEL:gemini-3.8-flash}
